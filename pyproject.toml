[project]
name = "caddie-llm"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "openai>=3.2.0",
    "pgvector>=0.5.0",
    "psycopg[binary]>=3.3.4",
    "pypdf>=6.16.1",
    "pytest>=9.1.1",
    "pytest-mock>=3.15.1",
    "spacy>=3.8.15",
]


[tool.pyright]
venvPath = "."
venv = ".venv"

[tool.fastapi]
entrypoint = "caddie_llm.main:app"

[tool.pytest.ini_options]
pythonpath = ["."]
